apiVersion: apps/v1
kind: Deployment
metadata:
  name: vetcare-deployment
  labels:
    app: vetcare-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vetcare-app
  template:
    metadata:
      labels:
        app: vetcare-app
    spec:
      containers:
        - name: vetcare-container
          image: 385936845252.dkr.ecr.us-east-1.amazonaws.com/vetcare:15
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
